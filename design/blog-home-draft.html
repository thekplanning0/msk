<title>케이의 비밀창고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 헤더+카테고리 탭 → 본문(최신 글 1개 크게 + 글 목록) | 사이드바(프로필, 카테고리, 인기 글, 태그, 광고) */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --ink: #1B1F27;
  --ink-soft: #5B6371;
  --line: #E1E4EA;
  --lamp: #B7801A;          /* 비밀창고 전등빛 (포인트) */
  --lamp-ink: #FFFFFF;
  --c-home: #3566C8;        /* 홈페이지 만들기 */
  --c-blog: #2D876A;        /* 블로그 만들기 */
  --c-ai: #6A4CC9;          /* AI 활용 프로그래밍 */
  --c-media: #C4513A;       /* 이미지·영상 생성 */
  --solved: #2D876A;
  --stuck: #B7801A;
  --thumb-ink: #FFFFFF;
  --font-logo: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --fs-sm: 0.8125rem;
  --fs-base: 1rem;
  --fs-md: 1.125rem;
  --fs-lg: 1.375rem;
  --fs-xl: clamp(1.5rem, 3.4vw, 2rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151B; --surface: #1A1E26; --ink: #E6E8EC; --ink-soft: #9AA2AF; --line: #2A303B;
    --lamp: #E0AE4E; --lamp-ink: #12151B;
    --c-home: #4D7FE0; --c-blog: #3E9C7D; --c-ai: #7F63DB; --c-media: #D2654D;
    --solved: #63C29E; --stuck: #E0AE4E; --thumb-ink: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151B; --surface: #1A1E26; --ink: #E6E8EC; --ink-soft: #9AA2AF; --line: #2A303B;
  --lamp: #E0AE4E; --lamp-ink: #12151B;
  --c-home: #4D7FE0; --c-blog: #3E9C7D; --c-ai: #7F63DB; --c-media: #D2654D;
  --solved: #63C29E; --stuck: #E0AE4E; --thumb-ink: #FFFFFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--fs-base); line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; }

/* 헤더 */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; gap: 16px; padding-block: 14px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-logo); font-size: 1.5rem; letter-spacing: .01em; white-space: nowrap; }
.logo svg { flex: none; }
.search { margin-left: auto; position: relative; flex: 0 1 260px; min-width: 0; }
.search input {
  width: 100%; font: inherit; font-size: var(--fs-sm); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 34px;
}
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; font: inherit; font-size: var(--fs-sm); font-weight: 500; color: var(--ink-soft); cursor: pointer;
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px 11px; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--lamp); font-weight: 700; }

/* 본문 + 사이드바 */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; padding-block: 32px 64px; align-items: start; }
.main { display: grid; gap: 28px; min-width: 0; }

/* 썸네일: 카테고리 색 + 그 글의 핵심 단어 */
.thumb {
  position: relative; display: grid; place-items: center; overflow: hidden; border-radius: 8px;
  color: var(--thumb-ink); background: var(--cat); aspect-ratio: 16 / 10; max-width: 100%;
}
.thumb::before { /* 비밀창고 문틈 빛 */
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(120% 90% at 85% 0%, rgba(255,255,255,.28), transparent 55%),
              repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 14px);
}
.thumb b { position: relative; font-family: var(--font-logo); font-weight: 400; font-size: clamp(1.25rem, 3vw, 2.25rem); text-align: center; padding: 0 10px; line-height: 1.15; }
.thumb small { position: absolute; left: 12px; bottom: 10px; font-size: .75rem; opacity: .9; }

/* 최신 글 (크게) */
.featured { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.featured .thumb b { font-size: clamp(1.75rem, 4.4vw, 3rem); }
.featured .body { display: grid; gap: 12px; align-content: center; min-width: 0; }
.featured h2 { font-size: var(--fs-xl); }
.featured .excerpt { color: var(--ink-soft); }
.read-more { justify-self: start; font-size: var(--fs-sm); font-weight: 700; color: var(--lamp-ink); background: var(--lamp); padding: 8px 14px; border-radius: 6px; }

.cat-chip { justify-self: start; display: inline-block; font-size: .75rem; font-weight: 700; color: var(--cat); border: 1.5px solid var(--cat); border-radius: 4px; padding: 1px 7px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.status { font-weight: 700; }
.status.solved { color: var(--solved); }
.status.stuck { color: var(--stuck); }

/* 글 목록 */
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.list-head h2 { font-size: var(--fs-lg); }
.list-head span { font-size: var(--fs-sm); color: var(--ink-soft); }
.posts { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.post { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; padding: 20px; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; }
.post .body { display: grid; gap: 8px; align-content: start; min-width: 0; }
.post h3 { font-size: var(--fs-md); }
.post h3 a:hover, .featured h2 a:hover, .popular a:hover { text-decoration: underline; text-decoration-color: var(--lamp); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.post .excerpt { color: var(--ink-soft); font-size: .9375rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ad-row { padding: 18px 20px; border-bottom: 1px solid var(--line); }
.ad-box { border: 1.5px dashed var(--line); border-radius: 8px; color: var(--ink-soft); font-size: var(--fs-sm); text-align: center; padding: 22px 12px; }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-soft); }
.pager { display: flex; justify-content: center; gap: 6px; }
.pager button { appearance: none; font: inherit; font-size: var(--fs-sm); min-width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.pager button[aria-current="page"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* 사이드바 */
.side { display: grid; gap: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 118px); }
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 12px; }
.widget h4 { font-size: var(--fs-base); }
.profile { text-align: center; justify-items: center; }
.keyhole { width: 84px; height: 84px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.profile .name { font-family: var(--font-logo); font-size: var(--fs-lg); }
.profile p { font-size: var(--fs-sm); color: var(--ink-soft); }
.cats { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.cats button {
  appearance: none; font: inherit; font-size: var(--fs-sm); color: var(--ink); background: none; border: 0; cursor: pointer;
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 6px; text-align: left;
}
.cats button:hover { background: var(--bg); }
.cats .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat); flex: none; }
.cats .n { margin-left: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.popular { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: p; }
.popular li { counter-increment: p; display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; font-size: var(--fs-sm); }
.popular li::before { content: counter(p); font-weight: 700; color: var(--lamp); font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags button { appearance: none; font: inherit; font-size: .75rem; color: var(--ink-soft); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.tags button:hover { color: var(--ink); }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: space-between; padding-block: 24px 36px; font-size: var(--fs-sm); color: var(--ink-soft); }
footer nav { display: flex; gap: 18px; flex-wrap: wrap; }

@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}
@media (max-width: 640px) {
  .featured { grid-template-columns: 1fr; padding: 16px; }
  .post { grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 16px; }
  .post .thumb b { font-size: 1rem; }
  .post .thumb small { display: none; }
  .post .excerpt { display: none; }
  .search { flex-basis: 140px; }
  .logo { font-size: 1.25rem; }
}
</style>

<header class="site-head">
  <div class="wrap">
    <div class="head-row">
      <a class="logo" href="#top" aria-label="케이의 비밀창고 처음으로">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--ink)"/><circle cx="14" cy="11" r="4" fill="var(--lamp)"/><path d="M11.5 13.5h5l1.3 8.5h-7.6z" fill="var(--lamp)"/></svg>
        케이의 비밀창고
      </a>
      <label class="search" for="q">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="글 검색" aria-label="글 검색">
      </label>

    <div class="tabs" role="tablist" aria-label="카테고리" id="tabs"></div>

</header>

<div class="wrap layout" id="top">

    <section aria-labelledby="list-title" style="display:grid;gap:14px">
      <div class="list-head">

      </div>
      <ul class="posts" id="posts"></ul>

        <button type="button" aria-current="page">1</button>
        <button type="button">2</button>

      </nav>

  <aside class="side" aria-label="사이드바">

      <div class="keyhole" aria-hidden="true">
        <svg width="34" height="44" viewBox="0 0 34 44"><circle cx="17" cy="14" r="11" fill="var(--lamp)"/><path d="M11 20h12l4 22H7z" fill="var(--lamp)"/></svg>
      </div>
      <div class="name">케이</div>
      <p>홈페이지, 블로그, AI 코딩, 이미지·영상 생성까지. 직접 만들다 막힌 곳과 결국 푼 방법을 여기 몰래 쌓아 둡니다.</p>

</div>

<footer>
  <div class="wrap">
    <span>© 2026 케이의 비밀창고 · 이 화면의 글은 모두 예시입니다</span>
    <nav aria-label="사이트 정보">

<script>
const CATS = [
  { id: "home",  name: "홈페이지 만들기",     color: "var(--c-home)" },
  { id: "blog",  name: "블로그 만들기",       color: "var(--c-blog)" },
  { id: "ai",    name: "AI 활용 프로그래밍",  color: "var(--c-ai)" },
  { id: "media", name: "이미지·영상 생성",    color: "var(--c-media)" }
];
// 예시 글. stuck = 막혀 있던 시간, solved = 해결 여부
const POSTS = [
  { cat: "ai", key: "403 차단", title: "클라우드 세션에서 참고 사이트가 안 열렸던 이유", excerpt: "레퍼런스 사이트를 보여주려는데 접속 자체가 막혔다. 알고 보니 코드 문제가 아니라 환경의 네트워크 정책이었다. 허용 도메인을 추가하는 방법까지 정리했다.", date: "2026.10.07", stuck: "40분", solved: true, views: 812, tags: ["Claude Code", "네트워크"] },
  { cat: "home", key: "히어로 사진", title: "AI로 회사 홈페이지 만들다 첫 화면 사진이 안 보였던 날", excerpt: "분명 이미지를 넣었는데 첫 화면이 까맣게 나왔다. 겹쳐 있던 레이어 순서와 투명도를 하나씩 바꿔 보며 찾은 원인.", date: "2026.10.06", stuck: "1시간 30분", solved: true, views: 1530, tags: ["HTML", "CSS"] },
  { cat: "blog", key: "WP vs 직접", title: "워드프레스냐 직접 만들기냐, 수익화 기준으로 골라 봤다", excerpt: "운영비, 속도, 보안, 매일 글 올리기 편한지까지 비교했다. 결론은 정적 사이트였고, 걱정했던 '매번 재발행' 문제도 직접 확인했다.", date: "2026.10.05", stuck: "하루", solved: true, views: 2210, tags: ["워드프레스", "애드센스"] },
  { cat: "media", key: "손가락 6개", title: "AI 이미지에서 손가락이 6개 나올 때 줄여 본 방법들", excerpt: "프롬프트만 바꿔서는 잘 안 됐다. 구도를 바꾸고, 손이 덜 보이게 하고, 부분 수정 기능을 쓴 결과를 전후 비교로 남겼다.", date: "2026.10.04", stuck: "3시간", solved: false, views: 1904, tags: ["이미지 생성", "프롬프트"] },
  { cat: "home", key: "모바일 메뉴", title: "모바일에서 메뉴 버튼이 안 눌렸던 30분", excerpt: "PC에서는 멀쩡한데 휴대폰 화면에서만 메뉴가 열리지 않았다. 원인은 화면 폭 기준을 잘못 잡은 한 줄이었다.", date: "2026.10.03", stuck: "30분", solved: true, views: 640, tags: ["반응형", "CSS"] },
  { cat: "ai", key: "첫 실수 3개", title: "AI에게 코드 맡길 때 처음에 했던 실수 3가지", excerpt: "한 번에 너무 많은 걸 시키기, 결과를 확인 안 하고 다음 단계로 넘어가기, 저장(커밋)을 안 해서 날려 먹기.", date: "2026.10.02", stuck: "2시간", solved: true, views: 1388, tags: ["Claude Code", "초보"] },
  { cat: "blog", key: "도메인 연결", title: "도메인 사고 블로그에 연결하기, DNS에서 헤맨 기록", excerpt: "주소를 샀는데 사이트가 안 뜬다. 하루 기다려야 한다는 말과 설정을 잘못했다는 말 사이에서 헤맨 이야기.", date: "2026.10.01", stuck: "하루", solved: false, views: 455, tags: ["도메인", "Cloudflare"] },
  { cat: "media", key: "크레딧 증발", title: "영상 생성 크레딧을 한 번에 날린 이유와 아끼는 순서", excerpt: "긴 영상을 바로 뽑았다가 크레딧이 순식간에 사라졌다. 짧은 시안부터 확인하고 늘려 가는 순서로 바꿨다.", date: "2026.09.30", stuck: "-", solved: true, views: 997, tags: ["영상 생성", "비용"] }
];
const catOf = id => CATS.find(c => c.id === id);
let activeCat = "all";
let query = "";

function thumb(p, big) {
  const c = catOf(p.cat);
  return `<a class="thumb" href="#top" style="--cat:${c.color}" aria-hidden="true" tabindex="-1"><b>${p.key}</b>${big ? "" : `<small>${c.name}</small>`}</a>`;
}
function meta(p) {
  return `<p class="meta"><span>${p.date}</span><span>막힌 시간 ${p.stuck}</span>` +
    `<span class="status ${p.solved ? "solved" : "stuck"}">${p.solved ? "해결함" : "아직 해결 중"}</span></p>`;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  const all = [{ id: "all", name: "전체" }, ...CATS];
  tabs.innerHTML = all.map(c =>
    `<button class="tab" role="tab" type="button" id="tab-${c.id}" data-cat="${c.id}" aria-selected="${c.id === activeCat}">${c.name}</button>`
  ).join("");
  tabs.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setCat(t.dataset.cat)));
}

function renderSide() {
  document.getElementById("side-cats").innerHTML = CATS.map(c =>
    `<li><button type="button" data-cat="${c.id}" style="--cat:${c.color}"><span class="dot"></span>${c.name}<span class="n">${POSTS.filter(p => p.cat === c.id).length}</span></button></li>`
  ).join("");
  document.querySelectorAll("#side-cats button").forEach(b => b.addEventListener("click", () => { setCat(b.dataset.cat); scrollTo({ top: 0, behavior: "smooth" }); }));

  document.getElementById("popular").innerHTML = [...POSTS].sort((a, b) => b.views - a.views).slice(0, 5)
    .map(p => `<li><a href="#top">${p.title}</a></li>`).join("");

  const tags = [...new Set(POSTS.flatMap(p => p.tags))];
  document.getElementById("tags").innerHTML = tags.map(t => `<button type="button" data-tag="${t}">#${t}</button>`).join("");
  document.querySelectorAll("#tags button").forEach(b => b.addEventListener("click", () => {
    const input = document.getElementById("q");
    input.value = b.dataset.tag; query = b.dataset.tag; renderList();
  }));
}

function renderFeatured() {
  const p = POSTS[0], c = catOf(p.cat);
  document.getElementById("featured").innerHTML =
    thumb(p, true) +
    `<div class="body">
      <span class="cat-chip" style="--cat:${c.color}">${c.name}</span>
      <h2><a href="#top">${p.title}</a></h2>
      <p class="excerpt">${p.excerpt}</p>
      ${meta(p)}
      <a class="read-more" href="#top">글 읽기</a>
    </div>`;
}

function renderList() {
  const q = query.trim().toLowerCase();
  const items = POSTS.slice(1).filter(p =>
    (activeCat === "all" || p.cat === activeCat) &&
    (!q || (p.title + p.excerpt + p.tags.join(" ")).toLowerCase().includes(q))
  );
  const list = document.getElementById("posts");
  document.getElementById("list-title").textContent = activeCat === "all" ? "전체 글" : catOf(activeCat).name;
  document.getElementById("list-count").textContent = `글 ${items.length}개`;
  if (!items.length) {
    list.innerHTML = `<li class="empty">${q ? `'${query}'에 맞는 글이 없어요. 다른 단어로 찾아보세요.` : "이 카테고리에는 아직 글이 없어요."}</li>`;
    return;
  }
  list.innerHTML = items.map((p, i) => {
    const c = catOf(p.cat);
    const row = `<li class="post">${thumb(p)}
      <div class="body">
        <span class="cat-chip" style="--cat:${c.color}">${c.name}</span>
        <h3><a href="#top">${p.title}</a></h3>
        <p class="excerpt">${p.excerpt}</p>
        ${meta(p)}
      </div></li>`;
    const ad = (i === 2 && items.length > 3) ? `<li class="ad-row"><div class="ad-box">목록 중간 광고 자리 (애드센스 승인 후 표시)</div></li>` : "";
    return row + ad;
  }).join("");
}

function setCat(id) {
  activeCat = id;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.cat === id)));
  renderList();
}

document.getElementById("q").addEventListener("input", e => { query = e.target.value; renderList(); });

renderTabs();
renderFeatured();
renderSide();
renderList();
</script>
